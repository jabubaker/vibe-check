<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vibe Check</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* Layout idea: phone-first sticker book. Chunky outlined cards with hard offset shadows, matcha green as the main colour, pink and yellow as stickers; thumb nav pinned to the bottom. */
:root{
  --bg:#eef4e3; --surface:#fffdf7; --ink:#1c2a1e; --muted:#56655a; --edge:#1c2a1e; --shadow:#1c2a1e; --line:#d5dfcc;
  --matcha:#8fc463; --pink:#ff8fb3; --sun:#ffd447; --on:#14210f; --chart:#2f7d32;
  --good:#1f7a45; --warn:#b4480f; --prev:#b9c4b4;
  --e-joy:#f2c21a; --e-trust:#7dbb5c; --e-fear:#3aa37a; --e-surprise:#45a9e0;
  --e-sadness:#5b7fe0; --e-disgust:#a274d6; --e-anger:#ee5d54; --e-anticipation:#f39a3d;
  --tint:38%;
  --display:"Fredoka","Trebuchet MS",system-ui,sans-serif;
  --body:"DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#131a14; --surface:#1d261e; --ink:#eef5e6; --muted:#a3b3a4; --edge:#dfe8d6; --shadow:#000000; --line:#344034;
    --matcha:#86c058; --pink:#ff8fb3; --sun:#ffd447; --on:#14210f; --chart:#9bd46a;
    --good:#7fd69b; --warn:#ffab73; --prev:#55624f; --tint:34%;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#131a14; --surface:#1d261e; --ink:#eef5e6; --muted:#a3b3a4; --edge:#dfe8d6; --shadow:#000000; --line:#344034;
  --matcha:#86c058; --pink:#ff8fb3; --sun:#ffd447; --on:#14210f; --chart:#9bd46a;
  --good:#7fd69b; --warn:#ffab73; --prev:#55624f; --tint:34%;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45}
.wrap{max-width:560px;margin:0 auto;padding:18px 16px 40px;display:flex;flex-direction:column;gap:18px}
header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px 14px}
h1{font-family:var(--display);font-weight:700;font-size:1.9rem;margin:0;line-height:1}
h1 span{background:var(--sun);color:var(--on);padding:0 8px;border-radius:10px;border:2px solid var(--edge);display:inline-block;transform:rotate(-3deg);margin-left:2px}
h2{font-family:var(--display);font-weight:600;font-size:1.3rem;margin:0;text-wrap:balance;line-height:1.2}
h3{font-family:var(--display);font-weight:600;font-size:1.05rem;margin:0}
p{margin:0}
.muted{color:var(--muted)} .small{font-size:.875rem}
.status{font-size:.8125rem;color:var(--muted);display:flex;align-items:center;gap:6px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--prev);flex:none;border:1px solid var(--edge)}
.dot.ok{background:var(--matcha)} .dot.dev{background:var(--sun)}
nav{position:sticky;top:8px;z-index:4;background:var(--surface);border:2px solid var(--edge);border-radius:18px;padding:5px;box-shadow:4px 4px 0 var(--shadow)}
nav div{display:flex;gap:3px}
nav a{flex:1;text-align:center;padding:6px 2px;border-radius:12px;text-decoration:none;color:var(--muted);font-weight:700;font-size:.68rem;white-space:nowrap;border:2px solid transparent;display:flex;flex-direction:column;gap:1px;align-items:center}
nav a i{font-style:normal;font-size:1.25rem;line-height:1.2}
nav a[aria-current="page"]{background:var(--sun);color:var(--on);border-color:var(--edge)}
.card{background:var(--surface);border:2px solid var(--edge);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:14px;box-shadow:4px 4px 0 var(--shadow)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.between{justify-content:space-between}
button,.btn{font:inherit;font-weight:700;border-radius:14px;border:2px solid var(--edge);background:var(--surface);color:var(--ink);padding:9px 14px;cursor:pointer;box-shadow:2px 2px 0 var(--shadow);text-decoration:none;display:inline-block}
button:active{transform:translate(2px,2px);box-shadow:none}
button.primary{background:var(--matcha);color:var(--on)}
button.on{background:var(--pink);color:var(--on)}
button.quiet{border-color:transparent;background:transparent;color:var(--muted);padding:4px 8px;font-size:.8125rem;box-shadow:none}
button:disabled{opacity:.45;cursor:not-allowed}
:focus-visible{outline:3px solid var(--chart);outline-offset:2px}
textarea,input[type=text]{font:inherit;width:100%;border:2px solid var(--edge);border-radius:14px;background:var(--bg);color:var(--ink);padding:10px 12px}
textarea{min-height:76px;resize:vertical}
label.lab{font-weight:700;font-size:.875rem;display:block;margin-bottom:4px}
.banner{border:2px dashed var(--edge);background:var(--surface);border-radius:14px;padding:10px 14px;font-size:.9rem}
.banner.care{border-style:solid;background:var(--pink);color:var(--on)}
/* wheel */
.wheelbox{max-width:420px;width:100%;margin:0 auto}
.wheel{width:100%;height:auto;display:block;touch-action:manipulation}
.sec path{stroke:var(--edge);stroke-width:2.5;cursor:pointer}
.sec text{text-anchor:middle;dominant-baseline:central;pointer-events:none}
.sec .w{font-family:var(--body);font-weight:700;font-size:12px;fill:var(--ink)}
.sec.sel .w{text-decoration:underline}
.sec.act path{stroke-width:5}
.sec:focus-visible{outline:none}.sec:focus-visible path{stroke:var(--chart);stroke-width:6}
.hub{fill:var(--surface);stroke:var(--edge);stroke-width:2.5}
.hubt{font-family:var(--display);font-weight:600;font-size:13px;fill:var(--muted);text-anchor:middle;dominant-baseline:central}
.sizes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.sizes button{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:2px;padding:8px 4px;min-height:86px;font-size:.85rem}
.sizes i{font-style:normal;line-height:1}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:5px;border:2px solid var(--edge);border-radius:999px;padding:2px 10px;font-size:.875rem;font-weight:500}
/* questionnaire */
fieldset{border:0;border-top:2px dotted var(--line);margin:0;padding:12px 0 4px;display:flex;flex-direction:column;gap:8px;min-width:0}
legend{padding:0;font-weight:500;float:left;width:100%}
.opts{display:flex;flex-wrap:wrap;gap:6px;clear:both}
.opts label{position:relative}
.opts input{position:absolute;opacity:0;inset:0;width:100%;height:100%;cursor:pointer;margin:0}
.opts span{display:block;border:2px solid var(--edge);border-radius:12px;padding:6px 10px;font-size:.875rem;background:var(--surface)}
.opts input:checked+span{background:var(--matcha);color:var(--on);font-weight:700}
.opts input:focus-visible+span{outline:3px solid var(--chart);outline-offset:2px}
.sticky{position:sticky;bottom:8px;background:var(--sun);color:var(--on);border:2px solid var(--edge);border-radius:14px;padding:8px 12px}
/* move */
.stamps{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.stamp{width:74px;height:74px;border-radius:50%;border:3px dashed var(--muted);display:grid;place-items:center;font-size:2rem;color:var(--muted);font-family:var(--display)}
.stamp.got{border:3px solid var(--edge);background:var(--matcha);transform:rotate(-8deg);box-shadow:3px 3px 0 var(--shadow)}
.stamp.got:nth-child(even){transform:rotate(6deg);background:var(--pink)}
.pick{display:flex;flex-wrap:wrap;gap:6px}
.pick button{font-weight:500;font-size:.9rem;padding:7px 11px}
.eff{display:grid;gap:8px}
.eff button{text-align:left;font-weight:500}
.eff b{display:block;font-family:var(--display);font-weight:600}
.idea{background:var(--sun);color:var(--on);border:2px solid var(--edge);border-radius:16px;padding:12px 14px;font-weight:500;transform:rotate(-1deg)}
/* stats */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.tile{border:2px solid var(--edge);border-radius:16px;padding:10px 12px;background:var(--bg)}
.tile .k{font-size:.8125rem;color:var(--muted)}
.tile .v{font-family:var(--display);font-size:1.8rem;font-weight:700;line-height:1.15;font-variant-numeric:tabular-nums}
.pill{display:inline-block;border-radius:999px;padding:2px 9px;font-size:.8125rem;font-weight:700;border:2px solid var(--line)}
.pill.good{color:var(--good);border-color:var(--good)} .pill.warn{color:var(--warn);border-color:var(--warn)}
.tablebox{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.875rem;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:.8rem;color:var(--muted);font-weight:700}
td.num,th.num{text-align:right}
.chartbox{position:relative}
.chart{width:100%;height:auto;display:block}
.chart text{font-family:var(--body);font-size:12px;fill:var(--muted)}
.chart .val{fill:var(--ink);font-weight:700;font-size:13px}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);font-size:.8125rem;padding:5px 9px;border-radius:8px;transform:translate(-50%,-130%);white-space:nowrap;display:none}
.bars{display:grid;grid-template-columns:auto 1fr;gap:7px 10px;align-items:center;font-size:.875rem}
.bars .pair{display:flex;flex-direction:column;gap:2px;min-width:0}
.bar{display:flex;align-items:center;gap:6px;height:12px}
.bar i{display:block;height:100%;border-radius:0 5px 5px 0;min-width:2px;background:var(--chart)}
.bar.prev i{background:var(--prev)}
.bar b{font-weight:700;font-size:.75rem;font-variant-numeric:tabular-nums}
.goalbar{position:relative;height:16px;background:var(--bg);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.goalbar i{display:block;height:100%;background:var(--chart)}
.goalbar u{position:absolute;left:50%;top:0;bottom:0;border-left:2px dashed var(--ink)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.8125rem;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:11px;height:11px;border-radius:3px;flex:none;display:inline-block}
.entry{border-top:2px dotted var(--line);padding-top:10px;display:flex;flex-direction:column;gap:6px}
.note{white-space:pre-wrap;overflow-wrap:anywhere}
footer{font-size:.8125rem;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:12px;font-size:.9rem;font-weight:500;display:none;z-index:5;max-width:calc(100% - 32px);text-align:center}
/* calm */
.mascot{font-size:2.6rem;line-height:1;flex:none}
.ladder{display:flex;flex-wrap:wrap;gap:6px}
.ladder button{font-size:.8rem;padding:6px 9px;line-height:1.25;text-align:center}
.ladder small{font-weight:500;opacity:.85}
.sess{align-items:center;text-align:center;min-height:68vh;justify-content:center}
.orbbox{width:240px;height:240px;display:grid;place-items:center}
.orb{width:230px;height:230px;border-radius:50%;background:radial-gradient(circle at 35% 30%,color-mix(in srgb,var(--matcha) 45%,var(--surface)),var(--matcha));border:3px solid var(--edge);box-shadow:4px 4px 0 var(--shadow);display:grid;place-items:center;font-size:3.2rem;transform:scale(.55);transition:transform .12s linear}
.cue{font-family:var(--display);font-size:1.4rem;font-weight:600;min-height:2em}
.cnt{font-family:var(--display);font-size:3rem;font-weight:700;line-height:1;font-variant-numeric:tabular-nums;min-height:3rem}
.ring{width:240px;height:240px;display:block}
.ring text{font-family:var(--display);fill:var(--ink);text-anchor:middle;dominant-baseline:central}
.drift{background:var(--sun);color:var(--on);font-size:1.05rem;padding:14px 20px}
.nline{font-family:var(--display);font-size:1.35rem;font-weight:500;min-height:6.5em;max-width:30ch;display:grid;place-items:center}
@media (prefers-reduced-motion:reduce){.orb{transition:none}}
@media (prefers-reduced-motion:no-preference){.bar i,.goalbar i{transition:width .3s}.stamp.got{animation:pop .35s}@keyframes pop{from{scale:1.5}to{scale:1}}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Vibe <span>Check</span></h1>
    <div class="status" id="status"><span class="dot"></span><span>Opening your journal</span></div>
  </header>
  <nav aria-label="Sections"><div>
  <a href="#today"><i aria-hidden="true">🦊</i>Today</a><a href="#move"><i aria-hidden="true">🥊</i>Move</a><a href="#calm"><i aria-hidden="true">🔔</i>Calm</a><a href="#scales"><i aria-hidden="true">📝</i>Check-ups</a><a href="#trends"><i aria-hidden="true">📈</i>Trends</a><a href="#setup"><i aria-hidden="true">⚙️</i>Setup</a>
</div></nav>
  <div id="banner"></div>
  <main id="main" class="wrap" style="padding:0"></main>
  <footer>This is your space to notice how you are doing. It is not a diagnosis and it does not replace your therapist. If you ever think about hurting yourself, call or text 988 (US) or call 911. Someone answers day and night.</footer>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
"use strict";
/* ---------- fixed content ---------- */
// Plutchik's wheel of emotions: 8 primary emotions, each at mild / basic / intense. The animals are only mascots.
const FAMILIES=[
 {id:"joy",a:"🦦",an:"otter",words:["serenity","joy","ecstasy"]},
 {id:"trust",a:"🐶",an:"pup",words:["acceptance","trust","admiration"]},
 {id:"fear",a:"🐰",an:"bunny",words:["apprehension","fear","terror"]},
 {id:"surprise",a:"🦉",an:"owl",words:["distraction","surprise","amazement"]},
 {id:"sadness",a:"🐳",an:"whale",words:["pensiveness","sadness","grief"]},
 {id:"disgust",a:"🐱",an:"cat",words:["boredom","disgust","loathing"]},
 {id:"anger",a:"🐲",an:"dragon",words:["annoyance","anger","rage"]},
 {id:"anticipation",a:"🦊",an:"fox",words:["interest","anticipation","vigilance"]}
];
const FAM={},WORD={};FAMILIES.forEach(f=>{FAM[f.id]=f;f.words.forEach((w,i)=>WORD[f.id+"-"+i]={w,f:f.id,a:f.a});});
// Burns Depression Checklist and Burns Anxiety Inventory: rated over the past week, 0 to 3 per item.
const BURNS="Burns Depression Checklist and Burns Anxiety Inventory © David D. Burns, MD.";
const BSTEM="Over the past week, how much have you been bothered by each of these?";
const BOPTS=["Not at all","Somewhat","Moderately","A lot"];
const SCALES={
 bdc:{name:"Burns Depression Checklist",short:"Depression",n:14,better:"lower",credit:BURNS,prompt:BSTEM,opts:BOPTS,care:13,
  items:["Sadness: Have you been feeling sad or down in the dumps?","Discouragement: Does the future look hopeless?","Low self-esteem: Do you feel worthless or think of yourself as a failure?",
   "Inferiority: Do you feel inadequate or inferior to others?","Guilt: Do you get self-critical and blame yourself for everything?","Indecisiveness: Do you have trouble making up your mind about things?",
   "Irritability and frustration: Have you been feeling resentful and angry a good deal of the time?","Loss of interest in life: Have you lost interest in your career, your hobbies, your family, or your friends?",
   "Loss of motivation: Do you feel overwhelmed and have to push yourself hard to do things?","Poor self-image: Do you think you're looking old or unattractive?",
   "Appetite changes: Have you lost your appetite? Or do you overeat or binge compulsively?","Sleep changes: Do you suffer from insomnia and find it hard to get a good night's sleep? Or are you excessively tired and sleeping too much?",
   "Hypochondriasis: Do you worry a great deal about your health?","Suicidal impulses: Do you have thoughts that life is not worth living or think that you might be better off dead?"],
  bands:[[0,4,"Minimal or no depression"],[5,10,"Borderline depression"],[11,20,"Mild depression"],[21,30,"Moderate depression"],[31,45,"Severe depression"]]},
 bai:{name:"Burns Anxiety Inventory",short:"Anxiety",n:33,better:"lower",credit:BURNS,prompt:BSTEM,opts:BOPTS,
  groups:{0:"Anxious feelings",6:"Anxious thoughts",17:"Physical symptoms"},
  items:["Anxiety, nervousness, worry, or fear","Feeling that things around you are strange, unreal, or foggy","Feeling detached from all or part of your body","Sudden unexpected panic spells",
   "Apprehension or a sense of impending doom","Feeling tense, stressed, “uptight”, or on edge",
   "Difficulty concentrating","Racing thoughts or having your mind jump from one thing to the next","Frightening fantasies or daydreams","Feeling that you're on the verge of losing control",
   "Fears of cracking up or going crazy","Fears of fainting or passing out","Fears of physical illnesses or heart attacks or dying","Concerns about looking foolish or inadequate in front of others",
   "Fears of being alone, isolated, or abandoned","Fears of criticism or disapproval","Fears that something terrible is about to happen",
   "Skipping or racing or pounding of the heart (sometimes called “palpitations”)","Pain, pressure, or tightness in the chest","Tingling or numbness in the toes or fingers",
   "Butterflies or discomfort in the stomach","Constipation or diarrhea","Restlessness or jumpiness","Tight, tense muscles","Sweating not brought on by heat","A lump in the throat",
   "Trembling or shaking","Rubbery or “jelly” legs","Feeling dizzy, lightheaded, or off balance","Choking or smothering sensations or difficulty breathing",
   "Headaches or pains in the neck or back","Hot flashes or cold chills","Feeling tired, weak, or easily exhausted"],
  bands:[[0,4,"Minimal or no anxiety"],[5,10,"Borderline anxiety"],[11,20,"Mild anxiety"],[21,30,"Moderate anxiety"],[31,50,"Severe anxiety"],[51,99,"Extreme anxiety or panic"]]}
};
const QGOAL=3; // check-ups per scale per week
const band=(k,t)=>{const b=SCALES[k].bands;return (b.find(x=>t>=x[0]&&t<=x[1])||(t>b[b.length-1][1]?b[b.length-1]:b[0]))[2];};
// Movement. Effort levels follow the CDC talk test.
const ACTS=[["box","🥊","Boxing"],["photo","📸","Fast photo walk"],["walk","🍵","Brisk walk"],["rope","⏱️","Jump rope"],["stairs","🪜","Stairs"],["home","🤸","Home workout"],["other","✨","Something else"]];
const ACT={};ACTS.forEach(a=>ACT[a[0]]=a);
const EFFORT=[["Light","You could sing along the whole time"],["Moderate","You can talk, but you can't sing"],["Vigorous","A few words, then you need a breath"]];
const IDEAS=[
 "📸 Photo sprint: speed-walk between five spots and take one shot at each. About 20 minutes.",
 "🥊 Shadowbox three rounds of three minutes in your room. 10 minutes, done.",
 "🍵 Walk fast to get matcha and take the long way there. About 25 minutes.",
 "🥊 Boxing class. It is already paid for. Go for the warm-up and decide the rest once you are there.",
 "📚 Stairs between homework blocks: up and down for 10 minutes, then back to it with a clearer head.",
 "🍜 Walk fast to a food spot you have not tried yet. Photos of the food count as a bonus.",
 "🤸 Follow one 15-minute workout video. Pick the one with the best playlist.",
 "⏱️ Jump rope: one minute on, one minute off, eight rounds."
];

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function weekStart(ts){const d=new Date(ts);d.setHours(0,0,0,0);d.setDate(d.getDate()-((d.getDay()+6)%7));return d.getTime();}
function prevWeek(ws){const d=new Date(ws);d.setDate(d.getDate()-7);return d.getTime();}
const fmtDay=ts=>new Date(ts).toLocaleDateString(undefined,{month:"short",day:"numeric"});
const fmtFull=ts=>new Date(ts).toLocaleString(undefined,{weekday:"short",month:"short",day:"numeric",hour:"numeric",minute:"2-digit"});
const r1=n=>Math.round(n*10)/10;
let toastT;function toast(m){const t=$("#toast");t.textContent=m;t.style.display="block";clearTimeout(toastT);toastT=setTimeout(()=>t.style.display="none",3500);}

/* ---------- storage: private per account, else this browser ---------- */
const LS="mood-journal-v1";
const Store={mode:"loading",db:null,col:null,docs:{},shared:{},wrote:false,owner:false};
function readLocal(){try{return JSON.parse(localStorage.getItem(LS)||"{}")||{};}catch(e){return {};}}
function writeLocal(){try{localStorage.setItem(LS,JSON.stringify(Store.docs));return true;}catch(e){return false;}}
function timeout(p,ms){return Promise.race([p,new Promise((_,rej)=>setTimeout(()=>rej({code:"timeout"}),ms))]);}
async function initStore(){
  let db=null,user=null,uid=null;
  try{
    for(let i=0;i<15&&!(window.claude&&window.claude.use);i++) await new Promise(r=>setTimeout(r,100));
    if(window.claude&&window.claude.use){[db,user]=await Promise.all([window.claude.use("db"),window.claude.use("user")]);}
    if(user){uid=await user.id();Store.owner=!!(await user.isOwner());}
  }catch(e){}
  Store.db=db;
  if(db&&uid){
    try{
      const col=db.collection("data/users/"+uid);
      const snap=await timeout(col.limit(1000).get(),10000);
      snap.docs.forEach(d=>{if(d.exists)Store.docs[d.id]=JSON.parse(JSON.stringify(d.data()));});
      Store.col=col;Store.mode="account";
      if(!Object.keys(Store.docs).length){const l=readLocal();if(Object.keys(l).length){Store.docs=l;Store.mode="device";}}
      return;
    }catch(e){}
  }
  Store.docs=readLocal();Store.mode="device";
}
function toDevice(){Store.mode="device";writeLocal();paintStatus();}
async function saveDoc(id,data){
  Store.docs[id]=data;
  if(Store.mode==="account"){
    try{await Store.col.doc(id).set(data);Store.wrote=true;return true;}
    catch(e){
      if(!Store.wrote&&e&&e.code!=="unavailable"&&e.code!=="resource_exhausted"){toDevice();return true;}
      delete Store.docs[id];toast("That did not save. Check your connection and try again.");return false;
    }
  }
  if(!writeLocal()){toast("This browser would not store that. Copy a backup from Setup.");return false;}
  return true;
}
async function removeDoc(id){
  const old=Store.docs[id];delete Store.docs[id];
  if(Store.mode==="account"){try{await Store.col.doc(id).delete();}catch(e){Store.docs[id]=old;toast("That did not delete. Try again.");return false;}}
  else writeLocal();
  return true;
}
function paintStatus(){

/* ---------- stats ---------- */
function weekly(es){
  const m=new Map();es.forEach(e=>{const w=weekStart(e.ts);const o=m.get(w)||{sum:0,n:0};o.sum+=e.total;o.n++;m.set(w,o);});
  return [...m.entries()].sort((a,b)=>b[0]-a[0]).map(([w,o])=>({w,avg:o.sum/o.n,n:o.n,prev:m.has(prevWeek(w))?m.get(prevWeek(w)).sum/m.get(prevWeek(w)).n:null}));
}
function deltaPill(k,d){
  if(d==null) return '<span class="muted">nothing the week before</span>';
  if(Math.abs(d)<0.05) return '<span class="pill">no change</span>';
  const good=(SCALES[k].better==="lower")===(d<0);
  return `<span class="pill ${good?"good":"warn"}">${d<0?"▼ down":"▲ up"} ${r1(Math.abs(d))} · ${good?"better":"tougher week"}</span>`;
}
function lineChart(k,es,mx){
  const s=SCALES[k],W=640,H=240,L=36,R=44,T=16,B=30,x0=es[0].ts,x1=es[es.length-1].ts;
  const X=t=>x1===x0?(L+(W-R))/2:L+(t-x0)/(x1-x0)*(W-L-R),Y=v=>T+(1-v/mx)*(H-T-B);
  const ticks=[0,mx/3,2*mx/3,mx],pts=es.map(e=>[X(e.ts),Y(e.total)]);
  const path=pts.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join("");
  const area=path+`L${pts[pts.length-1][0].toFixed(1)} ${Y(0)}L${pts[0][0].toFixed(1)} ${Y(0)}Z`,last=pts[pts.length-1];
  return `<div class="chartbox"><svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${s.short} score over time, latest ${es[es.length-1].total} out of ${mx}">
    ${ticks.map(t=>`<line x1="${L}" x2="${W-R}" y1="${Y(t)}" y2="${Y(t)}" stroke="var(--line)" stroke-width="1"/><text x="${L-6}" y="${Y(t)+4}" text-anchor="end">${t}</text>`).join("")}
    ${es.length>1?`<path d="${area}" fill="var(--chart)" opacity=".12"/><path d="${path}" fill="none" stroke="var(--chart)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>`:""}
    ${pts.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="${i===pts.length-1?6:4.5}" fill="var(--chart)" stroke="var(--surface)" stroke-width="2"/>`).join("")}
    <text class="val" x="${last[0]+10}" y="${last[1]+4}">${es[es.length-1].total}</text>
    <text x="${X(x0)}" y="${H-8}" text-anchor="${x1===x0?"middle":"start"}">${fmtDay(x0)}</text>${x1!==x0?`<text x="${W-R}" y="${H-8}" text-anchor="end">${fmtDay(x1)}</text>`:""}
    ${pts.map((p,i)=>`<circle class="hit" cx="${p[0]}" cy="${p[1]}" r="16" fill="transparent" data-tip="${esc(fmtDay(es[i].ts)+": "+es[i].total+" · "+band(k,es[i].total))}" data-x="${p[0]/W*100}" data-y="${p[1]/H*100}"/>`).join("")}
  </svg><div class="tip"></div></div>`;
}

const LVN=[["🌱","Sprout"],["🍃","Leaf"],["🍵","Whisk"],["🎋","Bamboo"],["🏯","Temple"],["🌕","Moon"],["🗻","Mountain"],["🌸","Blossom"],["⭐","Star"],["🌈","Rainbow"]];
// A calm day = at least 5 minutes of calm, any mix. Five calm days in a week earns the calm reward.
const UP=3,CGOAL=5,CMIN=300;
const dayKey=ts=>{const d=new Date(ts);d.setHours(0,0,0,0);return d.getTime();};
const daySecs=d=>entries("k").filter(e=>dayKey(e.ts)===d).reduce((a,e)=>a+(e.secs||0),0);
function calmDays(ws){const m=new Map();entries("k").filter(e=>weekStart(e.ts)===ws).forEach(e=>{const k=dayKey(e.ts),o=m.get(k)||{secs:0,ps:[]};o.secs+=e.secs||0;o.ps.push(e.p);m.set(k,o);});
  return [...m.entries()].sort((a,b)=>a[0]-b[0]).map(([d,o])=>({d,secs:o.secs,ps:o.ps,ok:o.secs>=CMIN}));}
const calmReward=()=>{const r=(Store.docs.prefs||{}).calmReward;return r==null?"$10":r;};
const calmLine=(ws,days)=>{const ok=days.filter(x=>x.ok).length,s=days.reduce((a,x)=>a+x.secs,0);return "Vibe Check calm, week of "+fmtDay(ws)+": "+ok+" of "+CGOAL+" calm days ("+Math.round(s/60)+" min in total)."+(ok>=CGOAL&&calmReward()?" Reward: "+calmReward():"");};
const FEEL=[["😣","Worse"],["😐","Same"],["🙂","A bit calmer"],["😌","Way calmer"]];
// Yoga nidra script: [first level, last level, words or list or "bell", seconds of quiet after]

const LEFT=RIGHT.map(x=>x.replace(/Right/g,"Left").replace(/right/g,"left"));
const NIDRA=[
 [0,2,"bell",6],
 [0,2,"Lie down on your back. Let your arms rest a little away from your body, palms up, and let your feet fall open.",8],

 [0,2,"Now we travel around the body. When you hear a body part, just notice it. You don't have to move it.",4],

 [0,0,["Left hand","Left arm","Left shoulder","Left side of your waist","Left hip","Left leg","Left foot"],3],

const NPACE=[1,1.5,2.1],WPS=2.2; // quiet stretches out at higher levels; spoken words per second
function nidraSteps(lv){const out=[];NIDRA.forEach(([a,z,x,w])=>{if(lv<a||lv>z)return;
  if(x==="bell")out.push({bell:1,w});else if(Array.isArray(x))x.forEach(s=>out.push({say:s,w:w*(1+lv*.25)}));else out.push({say:x,w:w*NPACE[lv]});});return out;}
const nidraEst=lv=>nidraSteps(lv).reduce((t,s)=>t+s.w+(s.say?s.say.split(/\s+/).length/WPS:0),0);
const nidraMins=lv=>Math.round(nidraEst(lv)/60);
const PRACT={
 breath:{a:"🐳",name:"4\u20117\u20118 breathing",line:"Breathe in for 4, hold for 7, whoosh out for 8, like a whale. It slows your heart down in about a minute.",steps:[2,3,4,6,8,12,16,20,26,32],unit:(n,i)=>n+" rounds · "+fmtSecs(5+n*19*UI.pace)},
 zen:{a:"🐸",name:"Zen sitting",line:"Sit still like a frog on a rock and count your breaths. When your mind wanders and you notice, that's one rep.",steps:[2,3,5,7,10,15,20],unit:(n,i)=>n+" min"},
 nidra:{a:"🦥",name:"Yoga nidra",line:"Lie down and let a voice walk you around your body. Like a nap, but you come out sharper. Great at bedtime.",steps:[0,1,2],unit:(n,i)=>"about "+nidraMins(i)+" min"}
};
Object.assign(UI,{calm:{},pace:1,voice:true,sess:null,cres:null,showClock:false});
const fmtSecs=s=>s<60?Math.round(s)+" sec":Math.round(s/60)+" min";
function calmLevel(p){const ds=entries("k").filter(e=>e.p===p&&e.done),max=PRACT[p].steps.length-1;let top=0;
  while(top<max&&ds.filter(e=>e.lv>=top).length>=UP)top++;
  return {top,n:Math.min(UP,ds.filter(e=>e.lv>=top).length),max};}

// Tibetan singing bowl, made from inharmonic sine partials with a slow decay. Paired, slightly detuned partials give the shimmer.
let AC=null,WL=null,TICK=null,VOICE=null;
function ac(){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==="suspended")AC.resume();}catch(e){AC=null;}return AC;}
function bell(o){o=o||{};const c=ac();if(!c)return;try{
  const t0=c.currentTime+(o.at||0),f=o.f||196,dur=o.dur||9,out=c.createGain();out.gain.value=o.vol==null?.4:o.vol;out.connect(c.destination);
  [[1,1],[2.71,.5],[5.13,.25],[8.41,.12],[12.3,.06]].forEach(([r,g],i)=>[0,1].forEach(j=>{
    const osc=c.createOscillator(),gn=c.createGain(),d=dur/(1+i*.7);osc.type="sine";osc.frequency.value=f*r*(j?1.0035:1);
    gn.gain.setValueAtTime(0,t0);gn.gain.linearRampToValueAtTime(g*.5,t0+.008);gn.gain.exponentialRampToValueAtTime(.0001,t0+d);
    osc.connect(gn);gn.connect(out);osc.start(t0);osc.stop(t0+d+.1);}));
}catch(e){}}
const chime=f=>bell({f,vol:.16,dur:2.5});
async function wake(on){try{if(on&&navigator.wakeLock)WL=await navigator.wakeLock.request("screen");else if(!on&&WL){await WL.release();WL=null;}}catch(e){}}
const canSpeak=()=>"speechSynthesis" in window&&typeof SpeechSynthesisUtterance!=="undefined";
// Rank voices so the most natural one wins: neural/premium voices first (Edge "Natural", Apple "Premium"/"Enhanced"),
// then Chrome's Google voices, then good built-in ones. Novelty voices (Zarvox, Bubbles…) never get picked.
const NOVELTY=/Albert|Bad News|Bahh|Bells|Boing|Bubbles|Cellos|Good News|Jester|Organ|Superstar|Trinoids|Whisper|Wobble|Zarvox|Fred|Junior|Ralph|Kathy|Hysterical|Deranged|Pipe|Grandma|Grandpa|Eddy|Flo|Reed|Rocko|Sandy|Shelley/i;
function voiceScore(v){const n=v.name;if(NOVELTY.test(n))return -1;let s=10;
  if(/natural|neural|premium|enhanced|siri/i.test(n))s=100;else if(/^Google UK English Female/i.test(n))s=85;else if(/^Google/i.test(n))s=80;
  else if(/Ava|Samantha|Allison|Susan|Zoe|Serena|Karen|Moira|Tessa|Aria|Jenny|Libby|Sonia|Daniel/i.test(n))s=50;
  if(/^en[-_](US|GB)/i.test(v.lang))s+=3;if(/compact/i.test(n))s-=20;return s;}
function voiceList(){try{return speechSynthesis.getVoices().filter(v=>/^en/i.test(v.lang)&&voiceScore(v)>=0).sort((a,b)=>voiceScore(b)-voiceScore(a));}catch(e){return [];}}
function pickVoice(){if(VOICE)return VOICE;const vs=voiceList(),want=(Store.docs.prefs||{}).voiceName;VOICE=vs.find(v=>v.name===want)||vs[0]||null;return VOICE;}
function speakLine(text,onDone){const u=new SpeechSynthesisUtterance(text),v=pickVoice();if(v){u.voice=v;u.lang=v.lang;}
  u.rate=v&&/^Google/i.test(v.name)?.9:.85;u.pitch=1;u.onend=onDone;u.onerror=onDone;speechSynthesis.speak(u);}
if(canSpeak())try{speechSynthesis.getVoices();speechSynthesis.onvoiceschanged=()=>{VOICE=null;if(route()==="calm"&&!UI.sess&&!UI.cres&&!document.querySelector("#voicePick:focus"))render();};}catch(e){}

function startSess(p){
  const P=PRACT[p],lv=UI.calm[p]!=null?UI.calm[p]:calmLevel(p).top,s={p,lv,t0:Date.now(),drift:0,last:null};
  ac();wake(true);
  if(p==="breath"){s.c=UI.pace;s.rounds=P.steps[lv];s.pre=5;s.total=s.pre+s.rounds*19*s.c;bell();}
  else if(p==="zen"){s.total=P.steps[lv]*60;bell();bell({at:4});bell({at:8});}
  else{s.steps=nidraSteps(lv);s.i=-1;s.total=nidraEst(lv);s.voice=UI.voice&&canSpeak();
    if(s.voice){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(" ");u.volume=0;speechSynthesis.speak(u);}catch(e){s.voice=false;}}}
  UI.sess=s;UI.cres=null;UI.showClock=false;render();window.scrollTo(0,0);
  TICK=setInterval(tick,100);tick();
}
function set(id,v,prop){const e=document.getElementById(id);if(e)e[prop||"textContent"]=v;}
function tick(){const s=UI.sess;if(!s)return;const el=(Date.now()-s.t0)/1000;
  if(s.p==="breath"){
    const c=s.c;let cue,cnt,sc,ph;
    if(el<s.pre){ph="pre";cue="Get comfy. Tongue tip behind your top front teeth. Breathe all the way out.";cnt=Math.ceil(s.pre-el);sc=.55;}
    else{const t=el-s.pre,cyc=19*c,r=Math.floor(t/cyc);if(r>=s.rounds){bell();return endSess(true);}const x=t-r*cyc;s.round=r+1;
      if(x<4*c){ph="in"+r;cue="In through your nose";cnt=Math.floor(x/c)+1;sc=.55+.45*x/(4*c);}
      else if(x<11*c){ph="hold"+r;cue="Hold";cnt=Math.floor((x-4*c)/c)+1;sc=1;}
      else{ph="out"+r;cue="Whoosh out through your mouth";cnt=Math.floor((x-11*c)/c)+1;sc=1-.45*(x-11*c)/(8*c);}}
    if(ph!==s.last){if(ph!=="pre")chime(ph[0]==="i"?660:ph[0]==="h"?495:392);s.last=ph;}
    const o=document.getElementById("orb");if(o)o.style.transform="scale("+sc.toFixed(3)+")";
    set("cue",cue);set("cnt",cnt);set("sub",ph==="pre"?"Starting…":"Round "+s.round+" of "+s.rounds);
  }else if(s.p==="zen"){
    if(el>=s.total){bell();return endSess(true);}
    const left=Math.ceil(s.total-el),o=document.getElementById("arc");if(o)o.setAttribute("stroke-dashoffset",(553*(1-el/s.total)).toFixed(1));
    set("clock",UI.showClock?Math.floor(left/60)+":"+String(left%60).padStart(2,"0"):"🐸");
    set("cue",el<10?"Sit tall, hands in your lap, eyes half-open, looking at the floor.":"Count each breath out, 1 up to 10. Lost count? Start again at 1.");
  }else{
    const now=Date.now();
    if(s.i<0||(s.phase==="wait"&&now>=s.until)){
      s.i++;if(s.i>=s.steps.length)return endSess(true);
      const st=s.steps[s.i];
      if(st.bell){bell();s.phase="wait";s.until=now+st.w*1000;}
      else{s.phase="say";s.line=st.say;const est=st.say.split(/\s+/).length/WPS,idx=s.i;set("nline",st.say);
        if(s.voice){s.sayEnd=now+(est*1.8+3)*1000;try{speakLine(st.say,()=>{if(UI.sess===s&&s.i===idx)s.sayEnd=0;});}catch(e){s.sayEnd=now+est*1200;}}
        else s.sayEnd=now+est*1200;}
    }
    if(s.phase==="say"&&now>=s.sayEnd){s.phase="wait";s.until=now+s.steps[s.i].w*1000;}
    const bar=document.getElementById("nbar");if(bar)bar.style.width=Math.min(100,el/s.total*100).toFixed(1)+"%";
  }
}
async function endSess(done){
  const s=UI.sess;if(!s)return;clearInterval(TICK);TICK=null;try{if(canSpeak())speechSynthesis.cancel();}catch(e){}wake(false);
  UI.sess=null;const secs=Math.round(Math.min(s.total,(Date.now()-s.t0)/1000)),before=calmLevel(s.p).top,dayBefore=daySecs(dayKey(Date.now()));
  if(!done&&secs<20){render();return;}
  const ts=Date.now(),id="k-"+ts.toString(36),doc={t:"k",ts,p:s.p,lv:s.lv,secs,done};if(s.p==="zen")doc.drift=s.drift;
  if(await saveDoc(id,doc)){const after=calmLevel(s.p).top;UI.cres={id,p:s.p,lv:s.lv,secs,done,drift:s.drift,up:after>before?after:null,feel:null,stamp:dayBefore<CMIN&&dayBefore+secs>=CMIN};}
  if(route()==="calm"){render();window.scrollTo(0,0);}
}

    <p class="cue" id="cue" aria-live="polite"></p><p class="cnt" id="cnt"></p>${stop}</section>`;
  if(s.p==="zen") return `<section class="card sess"><p class="small muted">${P.unit(P.steps[s.lv])} · ${LVN[s.lv][0]} ${LVN[s.lv][1]}</p>
    <button class="quiet" data-clock="1" aria-label="Show or hide the time left" style="padding:0;border:0"><svg class="ring" viewBox="0 0 200 200"><circle cx="100" cy="100" r="88" fill="none" stroke="var(--line)" stroke-width="10"/>
      <circle id="arc" cx="100" cy="100" r="88" fill="none" stroke="var(--chart)" stroke-width="10" stroke-linecap="round" stroke-dasharray="553" stroke-dashoffset="553" transform="rotate(-90 100 100)"/>
      <text id="clock" x="100" y="100" font-size="${UI.showClock?34:64}">🐸</text></svg></button>

    <button class="drift" data-drift="1">🐒 My mind wandered</button><p class="small" id="dcount">${s.drift?`Caught it ${s.drift} time${s.drift>1?"s":""}. Each catch is a rep.`:"Tap when you notice, then go back to counting."}</p>${stop}</section>`;
  return `<section class="card sess"><div class="mascot" aria-hidden="true">${P.a}</div><p class="nline" id="nline" aria-live="polite">${esc(s.line||"Settling in…")}</p>

    <p class="small muted">${s.voice?"Close your eyes and just listen.":"Read each line, then close your eyes for the quiet part. It moves on by itself."}</p>${stop}</section>`;
}
function viewCres(){
  const r=UI.cres,P=PRACT[r.p],L=calmLevel(r.p);
  const prog=L.top<L.max?`<p class="small">Toward ${LVN[L.top+1][0]} ${LVN[L.top+1][1]}: <strong>${"●".repeat(L.n)}${"○".repeat(UP-L.n)}</strong></p>`:"";
  return `<section class="card"><div class="row" style="flex-wrap:nowrap;gap:12px"><div class="mascot" aria-hidden="true">${P.a}</div>
    <h2>${r.done?"Done! "+fmtSecs(r.secs)+" of "+P.name.toLowerCase()+".":"Stopped after "+fmtSecs(r.secs)+". That still counts."}</h2></div>
    ${(()=>{const t=daySecs(dayKey(Date.now())),ok=calmDays(weekStart(Date.now())).filter(x=>x.ok).length;
      return r.stamp?`<div class="idea"><strong>Calm stamp earned for today! 🔔</strong><br>${ok} of ${CGOAL} this week.${ok>=CGOAL&&calmReward()?" Reward unlocked: "+esc(calmReward())+".":""}</div>`
        :t>=CMIN?`<p class="small">Today's calm stamp is already in ✓ (${fmtSecs(t)} today).</p>`
        :`<p><strong>Today: ${fmtSecs(t)} of 5 min.</strong> ${fmtSecs(CMIN-t)} more and today gets a stamp. Any practice counts.</p>`;})()}
    ${r.up!=null?`<div class="idea"><strong>Level up! ${LVN[r.up][0]} ${LVN[r.up][1]} unlocked.</strong><br>Next time: ${P.unit(P.steps[r.up],r.up)}. You can also stay where you are.</div>`:prog}
    ${r.p==="zen"&&r.drift?`<p>🐒 You caught your mind wandering <strong>${r.drift}</strong> time${r.drift>1?"s":""}. Noticing is the exercise, so that's ${r.drift} rep${r.drift>1?"s":""}.</p>`:""}
    <div><p class="lab">How do you feel now?</p><div class="pick">${FEEL.map((f,i)=>`<button data-feel="${i}" class="${r.feel===i?"on":""}" aria-pressed="${r.feel===i}">${f[0]} ${f[1]}</button>`).join("")}</div></div>
    <div class="row"><button class="primary" data-cdone="1">Done</button></div></section>`;
}
function viewCalm(){

      <p class="small muted" style="margin-top:6px">Quick keeps the same 4-7-8 rhythm, just faster. A little lightheaded at first is normal. If it happens, stop and breathe normally.</p></div>`;
    if(p==="nidra"){const vs=voiceList(),cur=pickVoice();

        ${vs.slice(0,12).map(v=>`<option value="${esc(v.name)}" ${cur&&v.name===cur.name?"selected":""}>${esc(v.name.replace(/\s*\(.*?\)\s*/g," ").trim())}${voiceScore(v)>=80?" ★":""}</option>`).join("")}</select><button data-vtest="1">▶ Test</button></div>
      <p class="small muted" style="margin-top:6px">★ = the most natural voices on this device. Still sounds robotic? On iPhone or Mac, download a better one: Settings → Accessibility → Spoken Content → Voices → English, then pick one marked Premium or Enhanced (Ava or Zoe sound great).</p></div>`:"");}
    return `<section class="card"><div class="row" style="flex-wrap:nowrap;align-items:flex-start;gap:12px"><div class="mascot" aria-hidden="true">${P.a}</div><div><h2>${P.name}</h2><p class="small muted">${P.line}</p></div></div>
      <div class="ladder">${P.steps.map((n,i)=>i<=L.top?`<button data-cpick="${p}" data-clv="${i}" class="${i===sel?"on":""}" aria-pressed="${i===sel}">${LVN[i][0]} ${LVN[i][1]}<br><small>${P.unit(n,i)}</small></button>`
        :`<button disabled>🔒 ${LVN[i][1]}<br><small>${P.unit(n,i)}</small></button>`).join("")}</div>
      <p class="small">${L.top<L.max?`Toward ${LVN[L.top+1][0]} ${LVN[L.top+1][1]}: <strong>${"●".repeat(L.n)}${"○".repeat(UP-L.n)}</strong> · ${UP-L.n} more at ${LVN[L.top][1]} or higher`:`Top level. You're a ${LVN[L.top][1]} now ${LVN[L.top][0]}`}</p>
      ${extra}<div class="row"><button class="primary" data-cstart="${p}">Start · ${P.unit(P.steps[sel],sel)}</button></div></section>`;
  }).join("")+
  (wk.length?`<section class="card"><h2>This week</h2>${wk.slice().reverse().map(e=>`<div class="entry"><div class="row between"><span>${PRACT[e.p].a} ${PRACT[e.p].name} · ${fmtSecs(e.secs)}${e.done?"":" (stopped early)"}${e.feel!=null?" · "+FEEL[e.feel][0]:""}</span>${delBtn(e.id)}</div><span class="small muted">${fmtFull(e.ts)}</span></div>`).join("")}</section>`:"");
}
function calmTrend(){
  const ks=entries("k");if(!ks.length) return `<section class="card"><h2>Calm</h2><p class="muted">No calm sessions yet. Try the whale on the Calm tab. It takes about a minute.</p></section>`;
  let w=weekStart(Date.now());const rows=[];
  for(let i=0;i<6;i++){const ds=calmDays(w);rows.push({w,n:ds.filter(x=>x.ok).length,secs:ds.reduce((a,x)=>a+x.secs,0)});w=prevWeek(w);}
  const rated=ks.filter(e=>e.feel!=null),calmer=rated.filter(e=>e.feel>=2).length,rc=entries("r").filter(e=>e.kind==="calm").length;
  return `<section class="card"><div><h2>Calm</h2><p class="muted small">Calm days per week (5+ minutes each). The dashed line is ${CGOAL}.${rc?` Calm rewards collected so far: ${rc}.`:""}</p></div>
    <div class="bars">${rows.map(r=>`<span>${fmtDay(r.w)}</span><div class="row" style="flex-wrap:nowrap"><div class="goalbar" style="flex:1"><i style="width:${r.n/7*100}%"></i><u style="left:${CGOAL/7*100}%"></u></div><b style="font-size:.8rem;white-space:nowrap">${r.n} · ${fmtSecs(r.secs)}</b></div>`).join("")}</div>
    <div class="tiles">${Object.keys(PRACT).map(p=>{const L=calmLevel(p);return `<div class="tile"><div class="k">${PRACT[p].a} ${PRACT[p].name}</div><div style="font-weight:700">${LVN[L.top][0]} ${LVN[L.top][1]}</div></div>`;}).join("")}
      ${rated.length?`<div class="tile"><div class="k">Felt calmer after</div><div class="v">${calmer} of ${rated.length}</div></div>`:""}</div></section>`;
}

/* ---------- setup ---------- */
function viewSetup(){
  return `<section class="card"><h2>Weekly rewards</h2><p class="small muted">What a full week of stamps earns. Leave one empty for no reward.</p>
    <div><label class="lab" for="reward">Reward for 3 stamps</label><input type="text" id="reward" maxlength="60" value="${esc(reward())}"></div>
    <div><label class="lab" for="calmReward">Reward for ${CGOAL} calm days</label><input type="text" id="calmReward" maxlength="60" value="${esc(calmReward())}"></div>
    <div class="row"><button id="saveReward">Save rewards</button></div></section>
  <section class="card"><h2>Backup</h2><p class="small muted">Everything you write lives in this browser on this device. A backup is a block of text holding all of it. Keep it somewhere only you can open.</p>
    <div class="row"><button id="copyBackup">Copy a backup</button></div>
    <div><label class="lab" for="restore">Restore from a backup</label><textarea id="restore" rows="3" spellcheck="false"></textarea></div>
    <div class="row"><button id="doRestore">Restore</button></div></section>`;
}
async function copyText(txt,ok){try{await navigator.clipboard.writeText(txt);toast(ok);}catch(e){$("#restore").value=txt;toast("Copying was blocked. The text is in the box; select and copy it.");}}

/* ---------- render + events ---------- */
const VIEWS={today:viewToday,move:viewMove,calm:viewCalm,scales:viewScales,trends:viewTrends,setup:viewSetup};
let VIEW=null;
function route(){if(VIEW)return VIEW;let h="";try{h=location.hash.slice(1);}catch(e){}return VIEWS[h]?h:"today";}
function go(v){if(!VIEWS[v])return;if(v!=="calm"){if(UI.sess)endSess(false);UI.cres=null;}if(v!=="scales"){UI.taking=null;UI.result=null;}else if(route()==="scales")UI.result=null;VIEW=v;UI.confirm=null;try{if(location.hash.slice(1)!==v)location.hash=v;}catch(e){}render();try{window.scrollTo(0,0);}catch(e){}}
function render(){
  const r=route();
  document.querySelectorAll("nav a").forEach(a=>a.getAttribute("href")==="#"+r?a.setAttribute("aria-current","page"):a.removeAttribute("aria-current"));
  if(Store.mode==="loading"){$("#main").innerHTML='<section class="card"><p class="muted">Opening your journal…</p></section>';return;}
  $("#main").innerHTML=VIEWS[r]();
  if(r==="scales")paintProgress();
}
function keepNote(){if($("#note"))UI.note=$("#note").value;}
function pickFamily(f){keepNote();UI.fam=UI.fam===f&&levelOf(f)==null?null:f;render();const g=document.querySelector('.sec[data-f="'+f+'"]');if(g&&document.activeElement===document.body)g.focus({preventScroll:true});}
const main=$("#main");
main.addEventListener("click",async ev=>{
  const t=ev.target,g=t.closest(".sec");
  if(g){pickFamily(g.dataset.f);return;}
  const b=t.closest("button,a");if(!b)return;
  if(b.tagName==="A"){const h=b.getAttribute("href")||"";if(h.charAt(0)==="#"){ev.preventDefault();if(b.dataset.done)UI.result=null;go(h.slice(1));}return;}
  if(b.dataset.lv!=null){keepNote();const f=UI.fam,lv=+b.dataset.lv,cur=levelOf(f);UI.sel=UI.sel.filter(x=>WORD[x].f!==f);if(cur!==lv)UI.sel.push(f+"-"+lv);render();}
  else if(b.id==="saveCheck"){b.disabled=true;const ts=Date.now();
    if(await saveDoc("c-"+ts.toString(36),{t:"c",ts,emotions:UI.sel.slice(),note:($("#note").value||"").trim().slice(0,4000)})){UI.sel=[];UI.fam=null;UI.note="";toast("Snapshot saved 📸");}render();}
  else if(b.dataset.cpick){UI.calm[b.dataset.cpick]=+b.dataset.clv;render();}
  else if(b.dataset.cstart){startSess(b.dataset.cstart);}
  else if(b.dataset.cstop){endSess(false);}
  else if(b.dataset.drift){const s=UI.sess;if(s){s.drift++;set("dcount","Caught it "+s.drift+" time"+(s.drift>1?"s":"")+". Each catch is a rep.");try{navigator.vibrate&&navigator.vibrate(25);}catch(e){}}}
  else if(b.dataset.clock){UI.showClock=!UI.showClock;render();tick();}
  else if(b.dataset.feel!=null){const r=UI.cres,d=r&&Store.docs[r.id];if(d&&await saveDoc(r.id,Object.assign({},d,{feel:+b.dataset.feel}))){r.feel=+b.dataset.feel;render();}}
  else if(b.dataset.cdone){UI.cres=null;render();}
  else if(b.dataset.cpace){UI.pace=+b.dataset.cpace;render();}
  else if(b.dataset.cvoice){UI.voice=!UI.voice;render();}
  else if(b.dataset.vtest){try{speechSynthesis.cancel();speakLine("Lie down, get comfortable, and let your whole body get heavy. There's nothing to do right now.",()=>{});}catch(e){toast("This browser could not play the voice.");}}
  else if(b.dataset.ask){keepNote();UI.confirm=b.dataset.ask;render();}
  else if(b.dataset.cancel){keepNote();UI.confirm=null;render();}
  else if(b.dataset.del){keepNote();UI.confirm=null;UI.card=null;await removeDoc(b.dataset.del);render();}
  else if(b.id==="shuffle"){let i;do{i=Math.floor(Math.random()*IDEAS.length);}while(i===UI.idea);UI.idea=i;render();}
  else if(b.dataset.act){UI.mv.act=b.dataset.act;render();}
  else if(b.dataset.mins){UI.mv.mins=+b.dataset.mins;render();}
  else if(b.dataset.eff!=null){UI.mv.eff=+b.dataset.eff;render();}
  else if(b.dataset.collect){const w=+b.dataset.collect;if(await saveDoc("r-"+w.toString(36),{t:"r",ts:Date.now(),w,reward:reward()}))toast("Collected. You earned it.");render();}
  else if(b.id==="saveReward"){const p=Object.assign({},Store.docs.prefs||{});p.reward=$("#reward").value.trim().slice(0,60);p.calmReward=$("#calmReward").value.trim().slice(0,60);if(await saveDoc("prefs",p))toast("Rewards saved");}
  else if(b.dataset.ccollect){const w=+b.dataset.ccollect;if(await saveDoc("r-c"+w.toString(36),{t:"r",kind:"calm",ts:Date.now(),w,reward:calmReward()}))toast("Collected. You earned it.");render();}
  else if(b.id==="copyCalm"){const now=weekStart(Date.now());try{await navigator.clipboard.writeText(calmLine(now,calmDays(now)));toast("Copied. Paste it into a message to Mom.");}catch(e){toast("Copying was blocked here. Take a screenshot instead.");}}
  else if(b.id==="mkCard"||b.id==="copyLine"){const now=weekStart(Date.now()),hard=entries("m").filter(e=>weekStart(e.ts)===now).filter(counted);
    if(b.id==="mkCard"){try{UI.card=makeCard(hard,now);}catch(e){toast("The picture could not be made here. Take a screenshot instead.");}render();}
    else{try{await navigator.clipboard.writeText(stampLine(hard,now));toast("Copied. Paste it into a message to Mom.");}catch(e){toast("Copying was blocked here. Screenshot the card instead.");}}}
  else if(b.id==="saveMove"){b.disabled=true;const ts=Date.now(),m=UI.mv;
    if(await saveDoc("m-"+ts.toString(36),{t:"m",ts,act:m.act,mins:m.mins,effort:m.eff})){toast(m.eff>=1?"Stamped! "+ACT[m.act][1]:"Logged. Easy days count as rest.");UI.mv={act:null,mins:20,eff:null};UI.card=null;}render();window.scrollTo(0,0);}
  else if(b.dataset.take){UI.taking=b.dataset.take;UI.answers=new Array(items(UI.taking).length).fill(null);UI.about="";render();window.scrollTo(0,0);}
  else if(b.dataset.quit){UI.taking=null;render();}
  else if(b.id==="saveScale"){b.disabled=true;const k=UI.taking,ts=Date.now(),total=UI.answers.reduce((a,v)=>a+v,0),q=items(k);
    const doc={t:"q",scale:k,ts,answers:UI.answers.slice(),total};const ab=$("#about")?$("#about").value.trim():"";if(ab)doc.about=ab;
    const care=SCALES[k].care!=null&&UI.answers[SCALES[k].care]>=1;
    if(await saveDoc("q-"+ts.toString(36),doc)){UI.result={scale:k,total,care,n:q.length,max:maxOf(k,q.length)};UI.taking=null;}render();window.scrollTo(0,0);}
  else if(b.dataset.done){UI.result=null;if(b.tagName==="BUTTON")render();}
  else if(b.id==="copyBackup"){copyText(JSON.stringify(Store.docs),"Backup copied. Paste it somewhere private.");}
  else if(b.id==="doRestore"){let d;try{d=JSON.parse($("#restore").value);}catch(e){}
    if(!d||typeof d!=="object"||Array.isArray(d)){toast("That is not backup text from this journal.");return;}
    let n=0;for(const [id,v] of Object.entries(d)){if(/^(scales|prefs|[cqmrk]-[a-z0-9]+)$/.test(id)&&v&&typeof v==="object"){if(await saveDoc(id,v))n++;}}
    toast("Restored "+n+" items");render();}
});
main.addEventListener("keydown",ev=>{const g=ev.target.closest&&ev.target.closest(".sec");if(g&&(ev.key===" "||ev.key==="Enter")){ev.preventDefault();pickFamily(g.dataset.f);}});
main.addEventListener("change",ev=>{const t=ev.target;
  if(t.type==="radio"&&UI.taking){UI.answers[+t.name.slice(1)]=+t.value;paintProgress();}
  else if(t.id==="voicePick"){VOICE=null;saveDoc("prefs",Object.assign({},Store.docs.prefs||{},{voiceName:t.value}));try{speechSynthesis.cancel();speakLine("This is how I'll sound.",()=>{});}catch(e){}}
});
main.addEventListener("input",ev=>{const t=ev.target;if(t.id==="note")UI.note=t.value;else if(t.id==="about")UI.about=t.value;});
main.addEventListener("submit",ev=>ev.preventDefault());
main.addEventListener("pointermove",ev=>{const h=ev.target.closest&&ev.target.closest(".hit");document.querySelectorAll(".tip").forEach(x=>x.style.display="none");
  if(h){const tip=h.closest(".chartbox").querySelector(".tip");tip.textContent=h.dataset.tip;tip.style.left=h.dataset.x+"%";tip.style.top=h.dataset.y+"%";tip.style.display="block";}});
document.querySelector("nav").addEventListener("click",ev=>{const a=ev.target.closest("a");if(a){ev.preventDefault();go(a.getAttribute("href").slice(1));}});
window.addEventListener("hashchange",()=>{let h="";try{h=location.hash.slice(1);}catch(e){}if(VIEWS[h]&&h!==VIEW)go(h);});
render();
initStore().then(()=>{paintStatus();render();});
</script>
</body>
</html>
